services:
  grafana:
    user: root
    container_name: 'vale-dynamic-cards-panel'
    build:
      context: .
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana-enterprise}
        grafana_version: ${GRAFANA_VERSION:-13.1.0}
        development: ${DEVELOPMENT:-false}
        anonymous_auth_enabled: ${ANONYMOUS_AUTH_ENABLED:-true}
    ports:
      - 3000:3000/tcp
    volumes:
      - ./dist:/var/lib/grafana/plugins/vale-dynamic-cards-panel
      - ./provisioning:/etc/grafana/provisioning
      - .:/root/vale-dynamic-cards
    environment:
      NODE_ENV: development
      GF_LOG_FILTERS: plugin.vale-dynamic-cards-panel:debug
      GF_LOG_LEVEL: debug
      GF_DATAPROXY_LOGGING: 1
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: vale-dynamic-cards-panel
